  const parse=d3.timeParse("%Y-%m-%d");

    const i=d3.bisector(function(d){return d.x;}).center(values,target);

    const b=target>=a.x?values[Math.min(values.length-1,i+1)]:values[Math.max(0,i-1)];
    if(!b||a.x.getTime()===b.x.getTime())return a;
    const left=a.x<b.x?a:b,right=a.x<b.x?b:a;
    const t=Math.max(0,Math.min(1,(target-left.x)/(right.x-left.x)));
    return {x:target,index:left.index+(right.index-left.index)*t,price:left.price+(right.price-left.price)*t};
  }
