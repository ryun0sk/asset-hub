name: Checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Node tests
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/*.cjs)
          if [ ${#files[@]} -gt 0 ]; then node --test "${files[@]}"; else echo "no node tests"; fi
      - run: git diff --check
